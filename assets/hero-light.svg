<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Dr. Ravi Teja Thiriveedhi — clinician turned AI systems architect">
<style>
 text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
 .in{opacity:0;animation:in .9s ease-out forwards}
 .d1{animation-delay:.15s} .d2{animation-delay:.45s} .d3{animation-delay:.75s}
 .net circle{animation:pulse 3.2s ease-in-out infinite}
 .net circle:nth-child(2n){animation-delay:1.1s} .net circle:nth-child(3n){animation-delay:2s}
 @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
 @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
 @media (prefers-reduced-motion:reduce){.in{opacity:1;animation:none} .net circle{animation:none}}
</style>
<rect x="1" y="1" width="1278" height="318" rx="6" fill="#FFFFFF" stroke="#D5DDDB"/>
<text class="in d1" x="72" y="62" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="1.6" fill="#0E7C74">CLINICIAN → AI SYSTEMS ARCHITECT</text>
<g class="net"><line x1="1040" y1="90" x2="1130" y2="150" stroke="#0E7C74" stroke-width="1.2" opacity=".35"/><line x1="1130" y1="150" x2="1010" y2="200" stroke="#0E7C74" stroke-width="1.2" opacity=".35"/><line x1="1040" y1="90" x2="1180" y2="70" stroke="#0E7C74" stroke-width="1.2" opacity=".35"/><line x1="1130" y1="150" x2="1200" y2="210" stroke="#0E7C74" stroke-width="1.2" opacity=".35"/><line x1="1010" y1="200" x2="1100" y2="250" stroke="#0E7C74" stroke-width="1.2" opacity=".35"/><line x1="1100" y1="250" x2="1200" y2="210" stroke="#0E7C74" stroke-width="1.2" opacity=".35"/><line x1="960" y1="130" x2="1040" y2="90" stroke="#0E7C74" stroke-width="1.2" opacity=".35"/><line x1="960" y1="130" x2="1010" y2="200" stroke="#0E7C74" stroke-width="1.2" opacity=".35"/><circle cx="1040" cy="90" r="7" fill="#0E7C74" opacity="0.9"/><circle cx="1130" cy="150" r="5" fill="#0E7C74" opacity="0.7"/><circle cx="1010" cy="200" r="6" fill="#0E7C74" opacity="0.8"/><circle cx="1180" cy="70" r="4" fill="#0E7C74" opacity="0.6"/><circle cx="1100" cy="250" r="5" fill="#0E7C74" opacity="0.7"/><circle cx="1200" cy="210" r="7" fill="#0E7C74" opacity="0.9"/><circle cx="960" cy="130" r="4" fill="#0E7C74" opacity="0.6"/></g>
<text class="in d1" x="72" y="108" font-size="44" font-weight="700" fill="#16201E">Dr. Ravi Teja Thiriveedhi</text>
<text class="in d2" x="72" y="154" font-size="24" font-weight="600" fill="#16201E">I build, govern and cost-engineer production multi-agent AI.</text>
<text class="in d2" x="72" y="196" font-size="18" fill="#47524F">Twenty years of clinical practice and hospital operations behind every design decision.</text>
<g class="in d3"><g class="chip"><rect x="72" y="238" width="138" height="34" rx="4" fill="#E2F2EF"/><text x="141.0" y="260" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5F59">Health-tech AI</text></g><g class="chip"><rect x="222" y="238" width="284" height="34" rx="4" fill="#E2F2EF"/><text x="364.0" y="260" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5F59">Forward-deployed AI engineering</text></g><g class="chip"><rect x="518" y="238" width="129" height="34" rx="4" fill="#E2F2EF"/><text x="582.5" y="260" text-anchor="middle" font-size="15" font-weight="600" fill="#0B5F59">AI governance</text></g></g>
<text x="1208" y="296" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1" fill="#47524F">Hyderabad, India · Remote (IST, UTC+5:30)</text>
</svg>
