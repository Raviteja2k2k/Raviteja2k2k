<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="432" viewBox="0 0 1280 432" role="img" aria-label="Measured, not claimed: Heartbeat tokens a day 12.0 M to 1.0 M; Memory search latency 48 s to 2.8 s; Gateway CPU 209% to 4%; Critical security findings 8 to 0; Extraction cost per message ~38k tok to ~4k tok">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif} .bar{transform-box:fill-box;transform-origin:left;animation:grow 1.1s ease-out both}
