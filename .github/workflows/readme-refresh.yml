name: Refresh README (latest work)
on:
  schedule: [{ cron: "0 21 * * *" }]    # 02:30 IST daily
  workflow_dispatch:
concurrency: { group: profile-writes, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Rebuild artwork and latest-work section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python3 scripts/build_assets.py
          python3 scripts/refresh_readme.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || git commit -m "chore: refresh latest work"
          git pull --rebase origin main && git push
