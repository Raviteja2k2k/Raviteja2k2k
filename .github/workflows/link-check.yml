name: Link check
on:
  push: { branches: [main] }
  schedule: [{ cron: "0 22 * * 0" }]    # Mondays 03:30 IST
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress README.md
          fail: true
