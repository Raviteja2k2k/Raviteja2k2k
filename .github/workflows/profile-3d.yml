name: 3D contribution calendar
on:
  schedule: [{ cron: "15 21 * * *" }]   # 02:45 IST daily
  workflow_dispatch:
concurrency: { group: profile-writes, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit calendar SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --cached --quiet || git commit -m "chore: refresh 3D contribution calendar"
          git pull --rebase origin main && git push
